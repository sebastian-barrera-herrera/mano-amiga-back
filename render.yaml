# Despliegue en Render (plan gratuito).
# En Render: New → Blueprint → repositorio mano-amiga-back.
services:
  - type: web
    name: mano-amiga-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    # Las migraciones son idempotentes: se aplican en cada arranque.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Se pegan a mano en el panel de Render (no van en el repositorio).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: manoamiga
