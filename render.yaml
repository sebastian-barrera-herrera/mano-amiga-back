# Despliegue en Render (plan gratuito).
# En Render: New → Blueprint → repositorio mano-amiga-back.
#
# Sólo te pedirá UN valor: DATABASE_URL. El resto ya va resuelto aquí
# (JWT_SECRET lo genera Render solo).
services:
  - type: web
    name: mano-amiga-back
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev es imprescindible: con NODE_ENV=production npm omitiría las
    # devDependencies, y `nest` (que compila el proyecto) es una de ellas.
    buildCommand: npm ci --include=dev && npm run build
    # Las migraciones son idempotentes: se aplican en cada arranque.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Cadena de conexión de Neon. Render la pide al crear el Blueprint.
      # Usa la "pooled connection" y cambia sslmode=require por verify-full.
      - key: DATABASE_URL
        sync: false

      # Dominio del frontend en Netlify. Admite `*` para las URL de
      # previsualización, p. ej. https://*--manoamigacolombia.netlify.app
      - key: CORS_ORIGINS
        value: https://manoamigacolombia.netlify.app

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d

      - key: CLOUDINARY_FOLDER
        value: manoamiga

# Variables opcionales: añádelas después en el panel de Render (Environment)
# sólo si vas a usar esas funciones. Sin ellas la app funciona igual.
#
#   CLOUDINARY_CLOUD_NAME · CLOUDINARY_API_KEY · CLOUDINARY_API_SECRET
#       Habilitan la subida de fotos.
#   GOOGLE_CLIENT_ID
#       Habilita el inicio de sesión con Google.
#   ADMIN_EMAILS
#       Correos que reciben rol de administrador al registrarse.
